<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Rating</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:0;background:#fff;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,
  sans-serif;color:#1a1a2e}
.wrap{max-width:660px;margin:0 auto;padding:2px}
h2{margin:0 0 8px;font-size:17px;letter-spacing:-.2px}
h3.pos{margin:22px 0 6px;font-size:14px;letter-spacing:-.1px}
col.c-pos{width:44px}
.pick{margin:0 0 12px}
select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid #d8d9e3;
  border-radius:8px;background:#fff;color:#1a1a2e;max-width:100%}
section{display:none}
section.on{display:block}
table{border-collapse:collapse;width:100%;table-layout:fixed}
col.c-rk{width:38px}
col.c-fl{width:26px}
col.c-pl{width:auto}
col.c-age{width:58px}
col.c-cp{width:30%}
col.c-rat{width:58px}
col.c-gp{width:42px}
col.c-num{width:50px}
th,td{padding:5px 6px;border-bottom:1px solid #ecedf3;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#6a6a80;
  text-align:right;border-bottom:1px solid #d8d9e3}
th.l,td.l{text-align:left}
td{text-align:right;font-variant-numeric:tabular-nums}
td.rk{color:#9a9ab0;font-size:12px;overflow:visible;text-overflow:clip}
td.fl{width:1%;padding-right:0}
td.fl img{display:block;width:19px;height:auto;border-radius:2px}
/* The name wraps rather than truncates: it is the one thing a reader cannot
   reconstruct from a fragment. */
td.pl{font-weight:600}
/* v1.31.2: the team wraps instead of the name. */
td.tm{color:#5a5a72;font-size:12px;white-space:normal;line-height:1.25}
/* COLUMNS SIZED BY WHAT IS IN THEM (v1.31.2): the name column as wide as the
   longest name in this list, the team column whatever is left. */
table{table-layout:auto}
col.c-pl,col.c-cp{width:auto}
td.pl,td.age,td.rat,td.st{overflow:visible;text-overflow:clip}
td.tm{min-width:90px}
@media(max-width:600px){
  section.on{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
td.rat{font-weight:700;color:#8a5a00}
/* Left, with its header: the age sits beside the name and reads as part of it,
   and a right-aligned header over a left-aligned column looks like a mistake. */
td.age{color:#5a5a72;font-size:12px;font-variant-numeric:tabular-nums;
  text-align:left}
/* The hover is the only place the full breakdown lives, so the cell says it is
   there rather than leaving a reader to discover it. */
td.tm[title]{cursor:help;text-decoration:underline dotted #c8c8d8}
tr:nth-child(even) td{background:#fafafd}
th[data-s]{cursor:pointer}
th[data-s]:hover{color:#1a1a2e}
th[aria-sort]{color:#8a5a00}
th[aria-sort="descending"]::after{content:" ↓"}
th[aria-sort="ascending"]::after{content:" ↑"}
.none{color:#8a8aa0;font-size:12px;margin:4px 0 0}
.unk{color:#b08030;font-weight:700;margin-left:2px}
.key{color:#8a8aa0;font-size:11px;margin:8px 0 0}
/* LAST 365 DAYS (v1.31): three columns, and a click opens a line per
   competition under the player. */
th.st,td.st{width:44px;color:#3a3a52;padding-left:2px;text-overflow:clip}
th.st{letter-spacing:0}
col.c-cp{width:24%}
tr[data-b]{cursor:pointer}
tr[data-b]:hover td{background:#f4f1ea}
tr.open td{background:#f4f1ea;border-bottom-color:transparent}
tr.sub td{background:#fbf9f4;color:#5a5a72;font-size:12px;
  padding-top:3px;padding-bottom:3px;border-bottom:1px solid #f1ece0}
tr.sub td.lg{white-space:normal;text-align:left;padding-left:2px}
@media(max-width:560px){
  th.st,td.st{width:34px}
  col.c-cp{width:20%}
}
@media(max-width:560px){
  th,td{padding:5px 2px;font-size:13px}
  th{font-size:10px;letter-spacing:.2px}
  col.c-rk{width:32px}
  col.c-fl{width:22px}
  col.c-age{width:48px}
  col.c-cp{width:26%}
  col.c-rat{width:48px}
  col.c-gp{width:30px}
  col.c-num{width:38px}
}
</style></head><body><div class="wrap">
<h2>Free Agent Rating</h2>

<section id="freeagents" class="on"><p class="none">No gr_adjusted.csv yet.</p><h3 class="pos">Top 10 · Point Guards</h3><p class="none">No gr_adjusted.csv yet.</p><h3 class="pos">Top 10 · Shooting Guards</h3><p class="none">No gr_adjusted.csv yet.</p><h3 class="pos">Top 10 · Small Forwards</h3><p class="none">No gr_adjusted.csv yet.</p><h3 class="pos">Top 10 · Power Forwards</h3><p class="none">No gr_adjusted.csv yet.</p><h3 class="pos">Top 10 · Centers</h3><p class="none">No gr_adjusted.csv yet.</p></section>
</div>
<script>
(function(){
  var sel = document.getElementById("pick");
  var secs = [].slice.call(document.querySelectorAll("section"));
  if(sel){
    sel.addEventListener("change", function(){
      secs.forEach(function(s){
        s.className = (s.id === sel.value) ? "on" : "";
      });
    });
  }
  // ONE PLAYER OPEN AT A TIME (v1.31): his competitions, a line each.
  var openRow = null;
  function closeAll(){
    [].slice.call(document.querySelectorAll("tr.sub")).forEach(function(x){
      x.parentNode.removeChild(x);
    });
    if(openRow) openRow.classList.remove("open");
    openRow = null;
  }
  document.addEventListener("click", function(ev){
    var tr = ev.target.closest ? ev.target.closest("tbody tr[data-b]") : null;
    if(!tr) return;
    var was = (openRow === tr);
    closeAll();
    if(was) return;
    var n = tr.cells.length, after = tr;
    tr.getAttribute("data-b").split(";").forEach(function(part){
      var f = part.split("|");
      if(f.length < 5) return;
      var s = document.createElement("tr");
      s.className = "sub";
      s.innerHTML = "<td></td><td></td>"
        + '<td class="lg" colspan="' + (n - 7) + '"></td>'
        + "<td></td><td>" + f[1] + '</td><td class="st">' + f[2]
        + '</td><td class="st">' + f[3] + '</td><td class="st">' + f[4] + "</td>";
      s.cells[2].textContent = f[0];
      after.parentNode.insertBefore(s, after.nextSibling);
      after = s;
    });
    tr.classList.add("open");
    openRow = tr;
  });
  // Sorting, per table, so one view's order does not follow the reader into
  // another. Rows are reordered in place; nothing is fetched and no table
  // changes height.
  [].slice.call(document.querySelectorAll("table")).forEach(function(tbl){
    var tb = tbl.querySelector("tbody");
    if(!tb) return;
    var all = [].slice.call(tb.querySelectorAll("tr"));
    var key = -1, desc = true;
    var ths = [].slice.call(tbl.querySelectorAll("thead th"));
    ths.forEach(function(th, i){
      if(!th.getAttribute("data-s")) return;
      th.addEventListener("click", function(){
        if(key === i) desc = !desc; else { key = i; desc = true; }
        var numeric = th.getAttribute("data-s") === "n";
        all.sort(function(a, b){
          var x = a.cells[i].textContent.trim(), y = b.cells[i].textContent.trim();
          if(numeric){
            var nx = parseFloat(x) || 0, ny = parseFloat(y) || 0;
            return desc ? ny - nx : nx - ny;
          }
          return desc ? y.localeCompare(x) : x.localeCompare(y);
        });
        ths.forEach(function(o){ o.removeAttribute("aria-sort"); });
        th.setAttribute("aria-sort", desc ? "descending" : "ascending");
        closeAll();
        tb.innerHTML = "";
        all.forEach(function(r, n){
          r.cells[0].textContent = n + 1;
          tb.appendChild(r);
        });
      });
    });
  });
})();
</script>
</body></html>
